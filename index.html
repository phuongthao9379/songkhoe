<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thử thách Lối sống Lành mạnh</title>
<meta name="description" content="Nhập buổi tập và theo dõi điểm Thử thách Lối sống Lành mạnh — phát triển bởi Nguyễn Phương Thảo">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sống Khỏe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="config.js"></script>
<style>
  :root{--pri:#0f766e;--acc:#f59e0b;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--pri);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;left:0;right:0;top:var(--top);bottom:0;width:100%;height:calc(100% - var(--top));border:0;background:#f3f6f5}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + var(--top)) 28px calc(24px + var(--bot));background:linear-gradient(160deg,#0f766e,#14a090);color:#fff;text-align:center;transition:opacity .35s}
  .screen.hide{opacity:0;pointer-events:none}
  .screen img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .screen h1{font-size:20px;margin:4px 0 0;line-height:1.3}
  .screen p{margin:0;opacity:.9;font-size:14px;max-width:320px}
  .credit{position:absolute;bottom:calc(18px + var(--bot));font-size:12px;opacity:.75}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.w{background:#fff;color:var(--pri)} .btn.o{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4)}
  #install{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--bot));z-index:20;background:#1f2933;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
  #install img{width:40px;height:40px;border-radius:10px;flex-shrink:0}
  #install .tx{flex:1;line-height:1.35}
  #install .tx strong{display:block;font-size:14.5px;margin-bottom:2px}
  #install .go{background:var(--acc);color:#1f2933;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
  #install .x{background:none;border:0;color:#cbd5d4;font-size:20px;cursor:pointer;padding:0 4px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="app" title="Thử thách Lối sống Lành mạnh" allow="fullscreen; clipboard-write"></iframe>

<!-- Màn hình chờ -->
<div id="splash" class="screen">
  <img src="icons/icon-192.png" alt="">
  <h1 id="spName">Thử thách Lối sống Lành mạnh</h1>
  <div class="spin" id="spSpin"></div>
  <p id="spMsg">Đang tải…</p>
  <div class="btns" id="spBtns" hidden>
    <button class="btn w" id="btnRetry">Thử lại</button>
    <a class="btn o" id="btnDirect" target="_blank" rel="noopener">Mở trực tiếp</a>
  </div>
  <div class="credit" id="spCredit">Phát triển bởi Nguyễn Phương Thảo</div>
</div>

<!-- Mất mạng -->
<div id="offline" class="screen" hidden>
  <img src="icons/icon-192.png" alt="">
  <h1 id="offTitle">Không có kết nối mạng</h1>
  <p id="offMsg">App cần Internet để tải và lưu dữ liệu. Hãy kiểm tra Wi-Fi/4G rồi thử lại.</p>
  <div class="btns"><button class="btn w" id="btnOffRetry">Thử lại</button></div>
</div>

<!-- Chưa cấu hình -->
<div id="setup" class="screen" hidden>
  <img src="icons/icon-192.png" alt="">
  <h1>Chưa cấu hình link web app</h1>
  <p>Mở file <b>config.js</b> và dán link Apps Script (kết thúc bằng <b>/exec</b>) vào <b>APP_URL</b>.</p>
</div>

<!-- Gợi ý cài đặt -->
<div id="install" hidden>
  <img src="icons/icon-192.png" alt="">
  <div class="tx" id="insTx"></div>
  <button class="go" id="insGo" hidden></button>
  <button class="x" id="insX" aria-label="Đóng">✕</button>
</div>

<script>
(function(){
  var C = window.APP_CONFIG || {};
  var EN = !/^vi/i.test(navigator.language || 'vi');
  var T = EN ? {
    loading:'Loading…', slow:'Slow connection? Try again or open the app directly.', retry:'Try again', direct:'Open directly',
    offT:'No internet connection', offM:'The app needs Internet to load and save data. Check Wi-Fi/4G and try again.',
    insAndroid:'<strong>Install the app</strong>Add it to your home screen for one-tap access.', insBtn:'Install',
    insIOS:'<strong>Install on iPhone</strong>Tap <b>Share ⬆️</b> then <b>Add to Home Screen</b>.',
    insInApp:'<strong>Open in your browser to install</strong>Tap <b>⋯</b> and choose <b>Open in browser</b> (Safari/Chrome).',
    name:C.NAME_EN, credit:'Developed by Nguyễn Phương Thảo'
  } : {
    loading:'Đang tải…', slow:'Mạng chậm? Hãy thử lại hoặc mở trực tiếp.', retry:'Thử lại', direct:'Mở trực tiếp',
    offT:'Không có kết nối mạng', offM:'App cần Internet để tải và lưu dữ liệu. Hãy kiểm tra Wi-Fi/4G rồi thử lại.',
    insAndroid:'<strong>Cài đặt ứng dụng</strong>Thêm vào màn hình chính để mở nhanh bằng 1 chạm.', insBtn:'Cài đặt',
    insIOS:'<strong>Cài lên iPhone</strong>Bấm <b>Chia sẻ ⬆️</b> rồi chọn <b>Thêm vào MH chính</b>.',
    insInApp:'<strong>Mở bằng trình duyệt để cài app</strong>Bấm <b>⋯</b> và chọn <b>Mở bằng trình duyệt</b> (Safari/Chrome).',
    name:C.NAME_VI, credit:C.CREDIT
  };
  var $ = function(id){ return document.getElementById(id); };
  var frame=$('app'), splash=$('splash');
  $('spName').textContent = T.name || $('spName').textContent;
  $('spCredit').textContent = T.credit || '';
  $('spMsg').textContent = T.loading; $('btnRetry').textContent = T.retry; $('btnDirect').textContent = T.direct;
  $('offTitle').textContent = T.offT; $('offMsg').textContent = T.offM; $('btnOffRetry').textContent = T.retry;

  var url = String(C.APP_URL || '');
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { splash.hidden = true; $('setup').hidden = false; return; }
  $('btnDirect').href = url;

  var slowTimer;
  function load(){
    if (!navigator.onLine) { $('offline').hidden = false; return; }
    $('offline').hidden = true;
    splash.classList.remove('hide'); splash.hidden = false;
    $('spSpin').hidden = false; $('spBtns').hidden = true; $('spMsg').textContent = T.loading;
    clearTimeout(slowTimer);
    slowTimer = setTimeout(function(){ $('spMsg').textContent = T.slow; $('spBtns').hidden = false; }, 15000);
    frame.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'pwa=1&t=' + Date.now();
  }
  frame.addEventListener('load', function(){
    if (!frame.src) return;
    clearTimeout(slowTimer);
    splash.classList.add('hide');
    setTimeout(function(){ splash.hidden = true; }, 400);
  });
  $('btnRetry').onclick = load;
  $('btnOffRetry').onclick = load;
  window.addEventListener('online', function(){ if (!$('offline').hidden) load(); });
  window.addEventListener('offline', function(){ $('offline').hidden = false; });
  load();

  /* ---- Service worker (mở nhanh + màn hình mất mạng) ---- */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

  /* ---- Gợi ý cài đặt ---- */
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var dismissed = false; try { dismissed = localStorage.getItem('hlc_install_x') === '1'; } catch(e) {}
  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var inApp = /Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(ua);
  var bar = $('install');
  function showBar(html, btn){ if (standalone || dismissed) return; $('insTx').innerHTML = html; $('insGo').hidden = !btn; if (btn) $('insGo').textContent = btn; bar.hidden = false; }
  $('insX').onclick = function(){ bar.hidden = true; try { localStorage.setItem('hlc_install_x','1'); } catch(e) {} };
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; showBar(T.insAndroid, T.insBtn); });
  $('insGo').onclick = function(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ bar.hidden = true; deferred = null; }); };
  window.addEventListener('appinstalled', function(){ bar.hidden = true; });
  if (inApp) setTimeout(function(){ showBar(T.insInApp); }, 1500);
  else if (isIOS) setTimeout(function(){ showBar(T.insIOS); }, 2500);
})();
</script>
</body>
</html>
